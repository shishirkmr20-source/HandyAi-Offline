apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

/**
 * React Native Gradle Plugin — autolinks native deps (including react-native-llama).
 */
react {
    autolinkLibrariesWithApp()
}

/**
 * Set this to true to Run Proguard on Release builds to minify the APK.
 */
def enableProguardInReleaseBuilds = true

/**
 * The preferred build flavor of JavaScriptCore (JSC).
 * E.g. "international" pulls in the ICU lib, "default" does not.
 */
def jscFlavor = 'org.webkit:android-jsc:+'

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdkVersion rootProject.ext.compileSdkVersion

    namespace "com.handyai"
    defaultConfig {
        applicationId "com.handyai"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0.0"

        // Only ship arm64-v8a — the typical modern Android phone.
        // llama.cpp is heavy; shipping multiple ABIs would balloon the APK.
        ndk {
            abiFilters "arm64-v8a"
        }

        externalNativeBuild {
            cmake {
                // Optional CMake args for llama.cpp tuning
                arguments "-DANDROID_STL=c++_shared"
                cppFlags "-std=c++17"
            }
        }
    }

    externalNativeBuild {
        cmake {
            path = file("src/main/cpp/CMakeLists.txt")  // optional, used if you add custom native code
            version rootProject.ext.cmakeVersion
        }
    }

    packaging {
        resources {
            excludes += [
                "META-INF/{AL2.0,LGPL2.1}",
                "**/libreactnativejni.so",
                "**/libc++_shared.so"
            ]
        }
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            // For first build: see README "Generate a release keystore"
            if (project.hasProperty('HANDYAI_UPLOAD_STORE_FILE')) {
                storeFile file(HANDYAI_UPLOAD_STORE_FILE)
                storePassword HANDYAI_UPLOAD_STORE_PASSWORD
                keyAlias HANDYAI_UPLOAD_KEY_ALIAS
                keyPassword HANDYAI_UPLOAD_KEY_PASSWORD
            }
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
            applicationIdSuffix ".debug"
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled enableProguardInReleaseBuilds
            shrinkResources enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation "com.facebook.react:react-android"
    implementation "com.facebook.react:hermes-android"

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }

    // react-native-llama is autolinked; nothing to declare here.
}

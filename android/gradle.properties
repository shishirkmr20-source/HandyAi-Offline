# Project-wide Gradle settings.

# JVM args — react-native-llama's native build needs plenty of heap
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m

# Use AndroidX
android.useAndroidX=true
android.enableJetifier=true

# Native build parallelism
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=false

# React Native config
reactNativeArchitectures=arm64-v8a
# Add x86_64 if you want to test on emulator: arm64-v8a,x86_64

# Flipper disabled for release builds
FLIPPER_VERSION=0.250.0

# Herbivore JS engine (smaller, faster than JSC for RN 0.75)
hermesEnabled=true
newArchEnabled=false

# Build tools
android.defaults.buildfeatures.buildconfig=true
android.nonTransitiveRClass=false
